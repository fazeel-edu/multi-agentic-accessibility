[project]
name = "systemc-v1"
version = "0.1.0"
description = "SystemC_V1: role-based multi-agent accessibility audit vs axe-core baseline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.177,<0.3",
    "playwright==1.65.2",
    "pydantic==2.14.4",
    "fastapi==0.165.0",
    "jinja2>=3.1.6",
    "lxml==6.1.3",
    "cssselect==1.6.0",
]

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config", "contract", "capture", "tools", "auditors", "postprocess",
    "eval", "store", "review", "cli", "tools_dev",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
